<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NHL Yesterday">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>NHL Yesterday</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #69707a;
      --border: #e1e4e8;
      --accent: #0b5cad;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2026;
        --text: #e8eaed;
        --muted: #9aa1aa;
        --border: #2c333b;
        --accent: #6aa8ec;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .controls button, .controls input {
      font: inherit;
      font-size: 16px; /* 16px+ stops iOS Safari zooming in on focus */
      min-height: 44px; /* Apple's minimum touch target */
      -webkit-appearance: none;
      appearance: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .controls button { cursor: pointer; min-width: 44px; touch-action: manipulation; }
    .controls input { flex: 1; min-width: 0; }
    .controls button:hover { border-color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .team { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .team.home { justify-content: flex-end; text-align: right; }
    .team img { width: 36px; height: 36px; flex: none; }
    .team span { font-weight: 600; overflow-wrap: anywhere; }
    .at { color: var(--muted); font-size: 0.9rem; }
    .venue {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-top: -4px;
    }
    .status { color: var(--muted); padding: 16px 0; }
    h2 { font-size: 1.25rem; margin: 36px 0 4px; }
    h3 {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      margin: 20px 0 10px;
    }
    @media (max-width: 420px) {
      .team img { width: 28px; height: 28px; }
      .team .full { display: none; }
    }
    @media (min-width: 421px) {
      .team .abbr { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>NHL games</h1>
    <p class="sub">Spoiler-free: matchups only, never scores.</p>

    <div class="controls">
      <button id="prev" aria-label="Previous day">&larr;</button>
      <input type="date" id="date" aria-label="Date">
      <button id="next" aria-label="Next day">&rarr;</button>
      <button id="yesterday">Yesterday</button>
    </div>

    <div id="status" class="status">Loading…</div>
    <ul id="games"></ul>

    <h2>Coming up</h2>
    <div id="upcoming-status" class="status">Loading…</div>
    <div id="upcoming"></div>
  </main>

  <script>
    // Data source: ESPN's public scoreboard endpoint (CORS-enabled).
    // Only team names, logos and venue are ever read from the response;
    // score, winner and result-detail fields are deliberately ignored.
    const API = "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=";

    const dateInput = document.getElementById("date");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("games");
    const upStatusEl = document.getElementById("upcoming-status");
    const upEl = document.getElementById("upcoming");
    const UPCOMING_DAYS = 7;

    function toISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function yesterday() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return toISO(d);
    }

    function shiftDate(days) {
      const [y, m, d] = dateInput.value.split("-").map(Number);
      const dt = new Date(y, m - 1, d + days);
      dateInput.value = toISO(dt);
      load();
    }

    function teamEl(competitor, side) {
      const t = competitor.team || {};
      const div = document.createElement("div");
      div.className = `team ${side}`;

      const img = document.createElement("img");
      img.src = t.logo || "";
      img.alt = "";
      img.loading = "lazy";
      img.onerror = () => { img.style.visibility = "hidden"; };
      if (!t.logo) img.style.visibility = "hidden";

      const full = document.createElement("span");
      full.className = "full";
      full.textContent = t.displayName || t.name || "TBD";

      const abbr = document.createElement("span");
      abbr.className = "abbr";
      abbr.textContent = t.abbreviation || full.textContent;

      if (side === "home") div.append(full, abbr, img);
      else div.append(img, full, abbr);
      return div;
    }

    function render(events) {
      listEl.innerHTML = "";
      // A game counts as "played" once it has finished (state "post").
      // Postponed/cancelled games are excluded.
      const played = events.filter(e => {
        const type = e.status && e.status.type;
        return type && type.state === "post" && type.completed;
      });

      const label = new Date(dateInput.value + "T12:00:00").toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });

      if (played.length === 0) {
        statusEl.textContent = `No NHL games were played on ${label}.`;
        return;
      }
      statusEl.textContent = `${played.length} game${played.length === 1 ? "" : "s"} played on ${label}`;

      for (const e of played) {
        const li = gameEl(e);
        if (li) listEl.append(li);
      }
    }

    // One matchup card. `note` is optional extra text (e.g. start time);
    // it is never derived from score or result fields.
    function gameEl(e, note) {
      const comp = (e.competitions || [])[0] || {};
      const cs = comp.competitors || [];
      const away = cs.find(c => c.homeAway === "away") || cs[0];
      const home = cs.find(c => c.homeAway === "home") || cs[1];
      if (!away || !home) return null;

      const li = document.createElement("li");
      const at = document.createElement("div");
      at.className = "at";
      at.textContent = "@";
      li.append(teamEl(away, "away"), at, teamEl(home, "home"));

      const details = [note, comp.venue && comp.venue.fullName].filter(Boolean);
      if (details.length) {
        const v = document.createElement("div");
        v.className = "venue";
        v.textContent = details.join(" · ");
        li.append(v);
      }
      return li;
    }

    function dayLabel(d) {
      return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    }

    // Games from today through the next UPCOMING_DAYS days, grouped by the
    // viewer's local day, showing only the start time. Games that are live
    // or already over today are still listed by start time only, so no
    // result ever shows.
    function renderUpcoming(events) {
      upEl.innerHTML = "";
      const today = toISO(new Date());
      const last = new Date();
      last.setDate(last.getDate() + UPCOMING_DAYS - 1);
      const lastISO = toISO(last);

      const groups = new Map();
      const sorted = events
        .filter(e => e.date)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      for (const e of sorted) {
        const start = new Date(e.date);
        const key = toISO(start);
        if (key < today || key > lastISO) continue;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(e);
      }

      if (groups.size === 0) {
        upStatusEl.textContent = `No NHL games scheduled in the next ${UPCOMING_DAYS} days.`;
        return;
      }
      upStatusEl.textContent = "";
      upStatusEl.hidden = true;

      for (const [key, games] of groups) {
        const h = document.createElement("h3");
        const [y, m, d] = key.split("-").map(Number);
        h.textContent = key === today ? `Today, ${dayLabel(new Date(y, m - 1, d))}` : dayLabel(new Date(y, m - 1, d));
        const ul = document.createElement("ul");
        for (const e of games) {
          const type = (e.status && e.status.type) || {};
          const note = type.name === "STATUS_POSTPONED" ? "Postponed"
            : type.name === "STATUS_CANCELED" ? "Cancelled"
            : new Date(e.date).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
          const li = gameEl(e, note);
          if (li) ul.append(li);
        }
        upEl.append(h, ul);
      }
    }

    async function loadUpcoming() {
      upStatusEl.hidden = false;
      upStatusEl.textContent = "Loading…";
      upEl.innerHTML = "";
      // ESPN dates are US Eastern; pad by a day on each side so every game
      // that falls on one of the viewer's local days is included.
      const from = new Date(); from.setDate(from.getDate() - 1);
      const to = new Date(); to.setDate(to.getDate() + UPCOMING_DAYS);
      const range = `${toISO(from).replaceAll("-", "")}-${toISO(to).replaceAll("-", "")}`;
      try {
        const res = await fetch(`${API}${range}&limit=200`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderUpcoming(data.events || []);
      } catch (err) {
        upStatusEl.textContent = `Couldn't load upcoming games (${err.message}). Try again later.`;
      }
    }

    async function load() {
      const value = dateInput.value;
      statusEl.textContent = "Loading…";
      listEl.innerHTML = "";
      try {
        const res = await fetch(API + value.replaceAll("-", ""));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (dateInput.value !== value) return; // a newer request superseded this one
        render(data.events || []);
      } catch (err) {
        statusEl.textContent = `Couldn't load games (${err.message}). Try again later.`;
      }
    }

    document.getElementById("prev").addEventListener("click", () => shiftDate(-1));
    document.getElementById("next").addEventListener("click", () => shiftDate(1));
    document.getElementById("yesterday").addEventListener("click", () => {
      dateInput.value = yesterday();
      load();
    });
    dateInput.addEventListener("change", load);

    // A home-screen app can stay suspended for days; when it comes back,
    // jump to the new "yesterday" if the user hadn't picked another date.
    let shownYesterday = yesterday();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      const now = yesterday();
      if (now !== shownYesterday && dateInput.value === shownYesterday) {
        dateInput.value = now;
        dateInput.max = toISO(new Date());
        load();
      }
      if (now !== shownYesterday) loadUpcoming();
      shownYesterday = now;
    });

    dateInput.value = yesterday();
    dateInput.max = toISO(new Date());
    load();
    loadUpcoming();
  </script>
</body>
</html>
