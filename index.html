<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NHL Yesterday">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>NHL Yesterday</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #69707a;
      --border: #e1e4e8;
      --accent: #0b5cad;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2026;
        --text: #e8eaed;
        --muted: #9aa1aa;
        --border: #2c333b;
        --accent: #6aa8ec;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .controls button, .controls input {
      font: inherit;
      font-size: 16px; /* 16px+ stops iOS Safari zooming in on focus */
      min-height: 44px; /* Apple's minimum touch target */
      -webkit-appearance: none;
      appearance: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .controls button { cursor: pointer; min-width: 44px; touch-action: manipulation; }
    .controls input { flex: 1; min-width: 0; }
    .controls button:hover { border-color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .team { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .team.home { justify-content: flex-end; text-align: right; }
    .team img { width: 36px; height: 36px; flex: none; }
    .team span { font-weight: 600; overflow-wrap: anywhere; }
    .at { color: var(--muted); font-size: 0.9rem; }
    .venue {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-top: -4px;
    }
    .status { color: var(--muted); padding: 16px 0; }
    h2 { font-size: 1.25rem; margin: 36px 0 4px; }
    h3 {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      margin: 20px 0 10px;
    }
    @media (max-width: 420px) {
      .team img { width: 28px; height: 28px; }
      .team .full { display: none; }
    }
    @media (min-width: 421px) {
      .team .abbr { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>NHL games</h1>
    <p class="sub">Spoiler-free: matchups only, never scores.</p>

    <div class="controls">
      <button id="prev" aria-label="Previous day">&larr;</button>
      <input type="date" id="date" aria-label="Date">
      <button id="next" aria-label="Next day">&rarr;</button>
      <button id="yesterday">Yesterday</button>
    </div>

    <div id="status" class="status">Loading…</div>
    <ul id="games"></ul>

    <h2>Coming up</h2>
    <div id="upcoming-status" class="status">Loading…</div>
    <div id="upcoming"></div>
  </main>

  <script>
    // Data source: ESPN's public scoreboard endpoint (CORS-enabled).
    // Only team names, logos and venue are ever read from the response;
    // score, winner and result-detail fields are deliberately ignored.
    const API = "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=";

    const dateInput = document.getElementById("date");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("games");
    const upStatusEl = document.getElementById("upcoming-status");
    const upEl = document.getElementById("upcoming");
    const UPCOMING_DAYS = 7;

    // All dates follow North American Eastern Time, the time zone the NHL
    // and ESPN schedule games in. Using the viewer's own clock (e.g. in
    // Europe) would put late games on two different days.
    const NHL_TZ = "America/New_York";

    // Today's date in Eastern Time as "YYYY-MM-DD".
    function nhlToday() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: NHL_TZ, year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    }

    // Shift a "YYYY-MM-DD" date by whole days (pure calendar arithmetic).
    function addDays(iso, days) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
    }

    function yesterday() {
      return addDays(nhlToday(), -1);
    }

    function shiftDate(days) {
      dateInput.value = addDays(dateInput.value, days);
      load();
    }

    function teamEl(competitor, side) {
      const t = competitor.team || {};
      const div = document.createElement("div");
      div.className = `team ${side}`;

      const img = document.createElement("img");
      img.src = t.logo || "";
      img.alt = "";
      img.loading = "lazy";
      img.onerror = () => { img.style.visibility = "hidden"; };
      if (!t.logo) img.style.visibility = "hidden";

      const full = document.createElement("span");
      full.className = "full";
      full.textContent = t.displayName || t.name || "TBD";

      const abbr = document.createElement("span");
      abbr.className = "abbr";
      abbr.textContent = t.abbreviation || full.textContent;

      if (side === "home") div.append(full, abbr, img);
      else div.append(img, full, abbr);
      return div;
    }

    function render(events) {
      listEl.innerHTML = "";
      // A game counts as "played" once it has finished (state "post").
      // Postponed/cancelled games are excluded.
      const played = events.filter(e => {
        const type = e.status && e.status.type;
        return type && type.state === "post" && type.completed;
      });
      played.sort((a, b) => new Date(a.date) - new Date(b.date));

      const label = new Date(dateInput.value + "T12:00:00Z").toLocaleDateString(undefined, {
        timeZone: "UTC", weekday: "long", month: "long", day: "numeric", year: "numeric"
      });

      if (played.length === 0) {
        statusEl.textContent = `No NHL games were played on ${label}.`;
        return;
      }
      statusEl.textContent = `${played.length} game${played.length === 1 ? "" : "s"} played on ${label}`;

      for (const e of played) {
        const li = gameEl(e);
        if (li) listEl.append(li);
      }
    }

    // One matchup card. `note` is optional extra text (e.g. start time);
    // it is never derived from score or result fields.
    function gameEl(e, note) {
      const comp = (e.competitions || [])[0] || {};
      const cs = comp.competitors || [];
      const away = cs.find(c => c.homeAway === "away") || cs[0];
      const home = cs.find(c => c.homeAway === "home") || cs[1];
      if (!away || !home) return null;

      const li = document.createElement("li");
      const at = document.createElement("div");
      at.className = "at";
      at.textContent = "@";
      li.append(teamEl(away, "away"), at, teamEl(home, "home"));

      const details = [note, comp.venue && comp.venue.fullName].filter(Boolean);
      if (details.length) {
        const v = document.createElement("div");
        v.className = "venue";
        v.textContent = details.join(" · ");
        li.append(v);
      }
      return li;
    }

    function dayLabel(iso) {
      return new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, {
        timeZone: "UTC", weekday: "long", month: "long", day: "numeric"
      });
    }

    function startTime(e) {
      return new Date(e.date).toLocaleTimeString("en-US", {
        timeZone: NHL_TZ, hour: "numeric", minute: "2-digit"
      }) + " ET";
    }

    // `days` is a list of [date, events] pairs, one per ESPN schedule day.
    // Each game is shown under the day ESPN lists it on, with its Eastern
    // start time only. Games that are live or already over today are still
    // listed by start time only, so no result ever shows.
    function renderUpcoming(days) {
      upEl.innerHTML = "";
      const today = nhlToday();
      const withGames = days.filter(([, events]) => events.length);

      if (withGames.length === 0) {
        upStatusEl.textContent = `No NHL games scheduled in the next ${UPCOMING_DAYS} days.`;
        return;
      }
      upStatusEl.textContent = "";
      upStatusEl.hidden = true;

      for (const [day, events] of withGames) {
        const h = document.createElement("h3");
        h.textContent = day === today ? `Today, ${dayLabel(day)}` : dayLabel(day);
        const ul = document.createElement("ul");
        const sorted = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
        for (const e of sorted) {
          const type = (e.status && e.status.type) || {};
          const note = type.name === "STATUS_POSTPONED" ? "Postponed"
            : type.name === "STATUS_CANCELED" ? "Cancelled"
            : e.date ? startTime(e) : "";
          const li = gameEl(e, note);
          if (li) ul.append(li);
        }
        upEl.append(h, ul);
      }
    }

    async function loadUpcoming() {
      upStatusEl.hidden = false;
      upStatusEl.textContent = "Loading…";
      upEl.innerHTML = "";
      // One request per day with the single-date query used for yesterday's
      // games (ESPN rejects date ranges with HTTP 400).
      const today = nhlToday();
      const days = [];
      for (let i = 0; i < UPCOMING_DAYS; i++) days.push(addDays(today, i));

      const results = await Promise.allSettled(days.map(async day => {
        const res = await fetch(API + day.replaceAll("-", ""));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return (await res.json()).events || [];
      }));

      const failed = results.filter(r => r.status === "rejected");
      if (failed.length === results.length) {
        upStatusEl.textContent = `Couldn't load upcoming games (${failed[0].reason.message}). Try again later.`;
        return;
      }
      renderUpcoming(days.map((day, i) =>
        [day, results[i].status === "fulfilled" ? results[i].value : []]));
      if (failed.length) {
        upStatusEl.hidden = false;
        upStatusEl.textContent = "Some days couldn't be loaded; the list may be incomplete.";
      }
    }

    async function load() {
      const value = dateInput.value;
      statusEl.textContent = "Loading…";
      listEl.innerHTML = "";
      try {
        const res = await fetch(API + value.replaceAll("-", ""));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (dateInput.value !== value) return; // a newer request superseded this one
        render(data.events || []);
      } catch (err) {
        statusEl.textContent = `Couldn't load games (${err.message}). Try again later.`;
      }
    }

    document.getElementById("prev").addEventListener("click", () => shiftDate(-1));
    document.getElementById("next").addEventListener("click", () => shiftDate(1));
    document.getElementById("yesterday").addEventListener("click", () => {
      dateInput.value = yesterday();
      load();
    });
    dateInput.addEventListener("change", load);

    // A home-screen app can stay suspended for days; when it comes back,
    // jump to the new "yesterday" if the user hadn't picked another date.
    let shownYesterday = yesterday();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      const now = yesterday();
      if (now !== shownYesterday && dateInput.value === shownYesterday) {
        dateInput.value = now;
        dateInput.max = nhlToday();
        load();
      }
      if (now !== shownYesterday) loadUpcoming();
      shownYesterday = now;
    });

    dateInput.value = yesterday();
    dateInput.max = nhlToday();
    load();
    loadUpcoming();
  </script>
</body>
</html>
